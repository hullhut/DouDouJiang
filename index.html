<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭按虎计分器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="dogs-container">
                <!-- 预留两只小狗照片的位置 -->
                <div class="dog-photo">🐶 狗1</div>
                <div class="dog-photo">🐶 狗2</div>
            </div>
            <h1>家庭计分器</h1>
        </header>

        <main>
            <div class="controls">
                <button id="startGameBtn">按虎计数，开始游戏</button>
            </div>

            <div id="gameRoundsContainer">
                <!-- 动态生成的游戏局控件将放在这里 -->
            </div>
            
            <div class="footer-controls">
                <div class="unit-input">
                    <label>计数单位 (元): </label>
                    <input type="number" id="scoreUnit" value="10" min="1">
                </div>
                <button id="endGameBtn">结束游戏 (结算)</button>
            </div>

            <div id="resultModal" class="hidden">
                <h2>结算结果</h2>
                <div id="resultContent"></div>
                <button id="closeModalBtn">关闭</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
