<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Mahjong Score Tracker</title>
    <link rel="stylesheet" href="/style.css?v=9">
</head>
<body>
    <div class="container">
        <div style="text-align: right; margin-bottom: -20px; position: relative; z-index: 10;">
            <button id="langToggle" style="background:transparent; border:none; cursor:pointer; font-weight:bold; color:#555;">中 / En</button>
        </div>
        
        <header class="header-title">
            <h1 id="mainTitle" data-i18n="title">🐶 🀄 家庭麻将计分器 🐕</h1>
        </header>

        <div class="action-buttons header-buttons">
            <button id="startGameBtn" class="primary-btn" data-i18n="startGame">
                开始游戏 ▶
            </button>
            <button id="clearAllBtn" class="clear-all-btn" data-i18n="clearAll" data-confirm="false">
                全部清空
            </button>
        </div>

        <main>
            <div id="gameRoundsContainer">
                <!-- Dynamic blocks -->
            </div>
        </main>
    </div>
    <script src="/app.js?v=9"></script>
</body>
</html>
