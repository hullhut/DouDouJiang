<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐶 🀄 麻将计分器 🐕</title>
    <link rel="stylesheet" href="/style.css?v=19">
</head>
<body>
    <div class="container">
        <!-- Top Nav Bar: Theme Demos + Language Toggle -->
        <div class="top-nav-bar">
            <div class="header-theme-switcher" id="themeSwitcher">
                <button class="theme-pill" data-theme="arcade">方案1: 街机3D</button>
                <button class="theme-pill" data-theme="card">方案2: 萌宠插画</button>
                <button class="theme-pill active" data-theme="minimal">方案3: 柔和质感</button>
            </div>
            <button id="langToggle">中 / En</button>
        </div>
        
        <!-- Header Banner Container (Defaulting to Theme 3 which user liked) -->
        <header class="header-title theme-minimal" id="headerBanner">
            <img src="/images/dogs-banner.jpg" class="theme-banner-img" id="themeBannerImg" alt="麻将萌犬" style="display:none;">
            <div class="header-inner">
                <div class="dog-badge-row">
                    <img class="dog-avatar-icon" id="leftDog" src="/images/dog-golden.jpg" alt="金毛">
                    <span class="mahjong-badge">🀄</span>
                    <h1 id="mainTitle" data-i18n="title">麻将计分器</h1>
                    <img class="dog-avatar-icon" id="rightDog" src="/images/dog-collie.jpg" alt="边牧">
                </div>
                <!-- Dog Avatar / Picture Options in Cartoon Illustrated Style -->
                <div class="dog-selector-bar" id="dogSelectorBar">
                    <span class="selector-label" id="dogSelectLabel">换萌犬:</span>
                    <button class="dog-pill active" data-left="/images/dog-golden.jpg" data-right="/images/dog-collie.jpg" data-name="duo">
                        <img src="/images/dogs-original.jpg" class="dog-pill-thumb" alt="金毛+边牧">
                        <span class="pill-text" data-i18n="duo">金毛+边牧</span>
                    </button>
                    <button class="dog-pill" data-left="/images/dog-golden.jpg" data-right="/images/dog-golden.jpg" data-name="golden">
                        <img src="/images/dog-golden.jpg" class="dog-pill-thumb" alt="金毛">
                        <span class="pill-text" data-i18n="golden">金毛</span>
                    </button>
                    <button class="dog-pill" data-left="/images/dog-collie.jpg" data-right="/images/dog-collie.jpg" data-name="collie">
                        <img src="/images/dog-collie.jpg" class="dog-pill-thumb" alt="边牧">
                        <span class="pill-text" data-i18n="collie">边牧</span>
                    </button>
                    <button class="dog-pill" data-left="/images/dog-corgi.jpg" data-right="/images/dog-corgi.jpg" data-name="corgi">
                        <img src="/images/dog-corgi.jpg" class="dog-pill-thumb" alt="柯基">
                        <span class="pill-text" data-i18n="corgi">柯基</span>
                    </button>
                    <button class="dog-pill" data-left="/images/dog-shiba.jpg" data-right="/images/dog-shiba.jpg" data-name="shiba">
                        <img src="/images/dog-shiba.jpg" class="dog-pill-thumb" alt="柴犬">
                        <span class="pill-text" data-i18n="shiba">柴犬</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="action-buttons header-buttons">
            <button id="startGameBtn" class="primary-btn" data-i18n="startGame">
                开始游戏 ▶
            </button>
            <button id="clearAllBtn" class="clear-all-btn" data-i18n="clearAll" data-confirm="false">
                全部清空
            </button>
        </div>

        <main>
            <div id="gameRoundsContainer">
                <!-- Dynamic blocks -->
            </div>
        </main>
    </div>
    <script src="/app.js?v=19"></script>
</body>
</html>
