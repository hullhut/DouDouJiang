<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐶 🀄 麻将计分器 🐕</title>
    <link rel="stylesheet" href="/style.css?v=30">
</head>
<body>
    <div class="container">
        <!-- Top Nav Bar: Language Toggle -->
        <div class="top-nav-bar">
            <button id="langToggle">中 / En</button>
        </div>
        
        <!-- Header Banner Container (Dual Language Flanking Dogs & Mahjong Rack) -->
        <header class="header-banner-container" id="headerBanner">
            <div class="banner-wrapper" id="bannerWrapper">
                <img src="/images/header-zh.png?v=30" class="header-theme-banner" alt="麻将计分器" id="headerBannerImg">
                <!-- Interactive Hotspots for Poodle, Fluffy Pup and Title -->
                <div class="pet-hotspot hotspot-left-poodle" id="hotspotLeftPoodle" title="泰迪贵宾"></div>
                <div class="pet-hotspot hotspot-right-fluffy" id="hotspotRightFluffy" title="花色小狗"></div>
                <div class="pet-hotspot hotspot-center-title" id="hotspotCenterTitle" title="麻将计分器"></div>
            </div>
            <h1 id="mainTitle" class="sr-only" data-i18n="title">麻将计分器</h1>
        </header>

        <div class="action-buttons header-buttons">
            <button id="startGameBtn" class="primary-btn" data-i18n="startGame">
                开始游戏 ▶
            </button>
            <button id="endSessionBtn" class="end-session-btn" data-i18n="endSession" data-confirm="false">
                结束游戏 🏆
            </button>
            <button id="clearAllBtn" class="clear-all-btn" data-i18n="clearAll" data-confirm="false">
                全部清空
            </button>
        </div>

        <main>
            <div id="gameRoundsContainer">
                <!-- Dynamic blocks -->
            </div>
        </main>
    </div>

    <!-- 单局结算明细弹窗 (展示每人虎数与详细计算过程) -->
    <div id="singleRoundModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="singleRoundModalTitle">第 1 局结算详情</h3>
                <button class="modal-close-btn" id="closeSingleModalBtn">✕</button>
            </div>
            <div class="modal-body" id="singleRoundModalBody">
                <!-- 动态填充 -->
            </div>
            <div class="modal-footer">
                <button class="modal-action-btn" id="confirmSingleModalBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 全局总结算大赢家排行榜弹窗 (支持按金额/按虎数切换) -->
    <div id="grandTotalModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="grandTotalModalTitle">🏆 全局结算大赢家 🏆</h3>
                <button class="modal-close-btn" id="closeGrandModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <!-- 统计维度切换选项卡 -->
                <div class="modal-tab-group">
                    <button id="tabMoneyBtn" class="modal-tab-btn active">💰 按金额统计</button>
                    <button id="tabTigersBtn" class="modal-tab-btn">🐯 按虎数统计</button>
                </div>
                <div id="grandTotalSubtitle" class="grand-total-subtitle">共进行了 0 局</div>
                <div id="grandTotalList" class="grand-total-list">
                    <!-- 动态排行榜 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-action-btn" id="confirmGrandModalBtn">关闭</button>
            </div>
        </div>
    </div>

    <script src="/scoring.js?v=30"></script>
    <script src="/app.js?v=30"></script>
</body>
</html>
