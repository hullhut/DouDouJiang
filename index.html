<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Mahjong Score Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="title-area">
                <div class="dogs-container">
                    <span class="dog">🐶</span>
                    <h1>Family Mahjong<br>Score Tracker</h1>
                    <span class="dog">🐕</span>
                </div>
            </div>
            <button id="startGameBtn">
                Start Game <span class="play-icon">▶</span>
            </button>
        </header>

        <main>
            <div id="gameRoundsContainer">
                <!-- 动态生成的游戏局控件将放在这里，初始为空 -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
