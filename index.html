<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻将计分器</title>
    <link rel="stylesheet" href="/style.css?v=13">
</head>
<body>
    <div class="container">
        <button id="langToggle">中 / En</button>
        
        <header class="header-title" style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
        <h1 id="mainTitle" style="color: #FFF; font-size: 36px; font-weight: 900; text-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 -3px 0 #4A90E2, 3px 0 0 #4A90E2, -3px 0 0 #4A90E2, 0 3px 0 #4A90E2; letter-spacing: 2px; margin: 0;"></h1>
    </header>

        <div class="action-buttons header-buttons">
            <button id="startGameBtn" class="primary-btn" data-i18n="startGame">
                开始游戏 ▶
            </button>
            <button id="clearAllBtn" class="clear-all-btn" data-i18n="clearAll" data-confirm="false">
                全部清空
            </button>
        </div>

        <main>
            <div id="gameRoundsContainer">
                <!-- Dynamic blocks -->
            </div>
        </main>
    </div>
    <script src="/app.js?v=13"></script>
</body>
</html>
