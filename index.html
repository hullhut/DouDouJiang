<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Mahjong Score Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <button id="langToggle">中 / En</button>
    <div id="app">
        <header>
            <div class="title-area">
                <div class="dogs-container">
                    <span class="dog">🐶</span>
                    <span class="mahjong-icon">🀄</span>
                    <h1 id="mainTitle" data-i18n="title">家庭麻将<br>计分器</h1>
                    <span class="mahjong-icon">🀅</span>
                    <span class="dog">🐕</span>
                </div>
            </div>
            <div class="header-buttons">
                <button id="startGameBtn" data-i18n="startGame">
                    开始游戏 ▶
                </button>
                <button id="clearAllBtn" data-i18n="clearAll" data-confirm="false">
                    全部清空
                </button>
            </div>
        </header>

        <main>
            <div id="gameRoundsContainer">
                <!-- Dynamic blocks -->
            </div>
        </main>
    </div>
    <script src="/app.js"></script>
</body>
</html>
