<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐶 🀄 麻将计分器 🐕</title>
    <link rel="stylesheet" href="/style.css?v=21">
</head>
<body>
    <div class="container">
        <!-- Top Nav Bar: Language Toggle -->
        <div class="top-nav-bar">
            <button id="langToggle">中 / En</button>
        </div>
        
        <!-- Header Banner Container (Final Design: Complete figures of both dogs flanking mahjong) -->
        <header class="header-title" id="headerBanner">
            <div class="header-stage">
                <!-- Left Dog: Full Figure Brown Curly Poodle with Blue Harness -->
                <div class="stage-dog-wrapper dog-left-wrapper">
                    <img src="/images/poodle-full.png" id="stageDogLeft" class="stage-dog-img" alt="泰迪贵宾">
                </div>

                <!-- Center Stage: Authentic Mahjong Tiles + Title -->
                <div class="stage-center">
                    <div class="mahjong-banner-decor">
                        <div class="mahjong-mini-tile red-dragon">中</div>
                        <div class="mahjong-mini-tile green-dragon">發</div>
                    </div>
                    <h1 id="mainTitle" data-i18n="title">麻将计分器</h1>
                </div>

                <!-- Right Dog: Full Figure White & Tan Fluffy Puppy -->
                <div class="stage-dog-wrapper dog-right-wrapper">
                    <img src="/images/fluffy-full.png" id="stageDogRight" class="stage-dog-img" alt="花色小狗">
                </div>
            </div>
        </header>

        <div class="action-buttons header-buttons">
            <button id="startGameBtn" class="primary-btn" data-i18n="startGame">
                开始游戏 ▶
            </button>
            <button id="clearAllBtn" class="clear-all-btn" data-i18n="clearAll" data-confirm="false">
                全部清空
            </button>
        </div>

        <main>
            <div id="gameRoundsContainer">
                <!-- Dynamic blocks -->
            </div>
        </main>
    </div>
    <script src="/app.js?v=21"></script>
</body>
</html>
